<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Serverless Web Application on AWS</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#555">Static frontend (S3 + CloudFront) · REST API (API Gateway + Lambda) · Data (DynamoDB)</text>

  <!-- User -->
  <rect x="40" y="120" width="120" height="70" rx="8" fill="#EAEDED" stroke="#879196"/>
  <text x="100" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">User</text>
  <text x="100" y="170" text-anchor="middle" font-size="11" fill="#555">Browser</text>

  <!-- CloudFront -->
  <rect x="220" y="80" width="150" height="70" rx="8" fill="#F2E9FB" stroke="#8C4FFF"/>
  <text x="295" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">CloudFront</text>
  <text x="295" y="127" text-anchor="middle" font-size="10" fill="#555">CDN · HTTPS · cache</text>

  <!-- S3 -->
  <rect x="430" y="80" width="150" height="70" rx="8" fill="#E6F4EA" stroke="#3F8624"/>
  <text x="505" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">S3 Bucket</text>
  <text x="505" y="127" text-anchor="middle" font-size="10" fill="#555">static site (private)</text>

  <!-- API Gateway -->
  <rect x="220" y="220" width="150" height="70" rx="8" fill="#F2E9FB" stroke="#8C4FFF"/>
  <text x="295" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">API Gateway</text>
  <text x="295" y="267" text-anchor="middle" font-size="10" fill="#555">HTTP API · /items</text>

  <!-- Lambda -->
  <rect x="430" y="220" width="150" height="70" rx="8" fill="#FCE8E6" stroke="#ED7100"/>
  <text x="505" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Lambda</text>
  <text x="505" y="267" text-anchor="middle" font-size="10" fill="#555">Python · API logic</text>

  <!-- DynamoDB -->
  <rect x="640" y="220" width="150" height="70" rx="8" fill="#E8F0FB" stroke="#2E73B8"/>
  <text x="715" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">DynamoDB</text>
  <text x="715" y="267" text-anchor="middle" font-size="10" fill="#555">NoSQL · on-demand</text>

  <!-- IAM note -->
  <rect x="430" y="330" width="150" height="56" rx="8" fill="#FFF8E1" stroke="#D4A017"/>
  <text x="505" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">IAM Role</text>
  <text x="505" y="372" text-anchor="middle" font-size="10" fill="#555">least-privilege</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <!-- user to cloudfront -->
  <line x1="160" y1="145" x2="218" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- cloudfront to s3 -->
  <line x1="370" y1="115" x2="428" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- user to api gateway (API calls) -->
  <line x1="160" y1="170" x2="218" y2="245" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- api gateway to lambda -->
  <line x1="370" y1="255" x2="428" y2="255" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- lambda to dynamodb -->
  <line x1="580" y1="255" x2="638" y2="255" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- lambda to iam -->
  <line x1="505" y1="290" x2="505" y2="328" stroke="#879196" stroke-width="1.2" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <text x="190" y="205" font-size="9" fill="#777">API calls</text>
  <text x="250" y="70" font-size="9" fill="#777">static content</text>

  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#999">Infrastructure defined in Terraform · fully serverless · pay-per-use · auto-scaling</text>
</svg>
